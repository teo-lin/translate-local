# HTML Tag Preservation Example
#
# Demonstrates translation with HTML markup.
# Tags are automatically preserved during translation.

metadata:
  source_language: en
  target_languages:
    - ro
  tag_format: html
  created_at: '2026-01-05T19:00:00'
  updated_at: '2026-01-05T19:00:00'

blocks:
  # Basic HTML formatting
  html-bold:
    source_text: 'This is <b>important</b> text.'
    translations:
      ro: ''
    category: ui

  html-italic:
    source_text: 'Please read the <i>terms and conditions</i> carefully.'
    translations:
      ro: ''
    category: ui

  html-link:
    source_text: 'Visit our <a href="https://example.com">website</a> for more information.'
    translations:
      ro: ''
    category: ui

  # Nested HTML
  html-nested:
    source_text: 'This is <b>bold and <i>italic</i></b> text.'
    translations:
      ro: ''
    category: ui

  # Complex HTML with attributes
  html-complex:
    source_text: 'Click <a href="/help" class="btn btn-primary">here</a> to get help.'
    translations:
      ro: ''
    category: ui

  # Multiple tags
  html-multiple:
    source_text: 'We offer <b>fast</b> delivery and <b>24/7</b> support.'
    translations:
      ro: ''
    category: marketing

  # Styled text
  html-styled:
    source_text: 'The price is <span style="color: red; font-weight: bold;">$99.99</span>'
    translations:
      ro: ''
    category: product
    context: 'Product price display'

  # Paragraph with formatting
  html-paragraph:
    source_text: 'Welcome to our <b>premium</b> service. You will receive <i>exclusive</i> benefits and <u>priority</u> support.'
    translations:
      ro: ''
    category: marketing
    context: 'Premium membership description'
