# Markdown Formatting Example
#
# Demonstrates translation with Markdown syntax.
# Markdown formatting is preserved during translation.

metadata:
  source_language: en
  target_languages:
    - ro
    - es
  tag_format: markdown
  created_at: '2026-01-05T19:00:00'
  updated_at: '2026-01-05T19:00:00'

blocks:
  # Bold text
  md-bold:
    source_text: 'This is **very important** information.'
    translations:
      ro: ''
      es: ''
    category: documentation

  # Italic text
  md-italic:
    source_text: 'Please note: this feature is *experimental*.'
    translations:
      ro: ''
      es: ''
    category: documentation

  # Inline code
  md-code:
    source_text: 'Use the `translate()` function to convert text.'
    translations:
      ro: ''
      es: ''
    category: documentation
    context: 'API documentation'

  # Links
  md-link:
    source_text: 'For more details, see the [documentation](https://example.com/docs).'
    translations:
      ro: ''
      es: ''
    category: documentation

  # Mixed formatting
  md-mixed:
    source_text: 'The **new** version includes *improved* performance and `bug fixes`.'
    translations:
      ro: ''
      es: ''
    category: release_notes

  # Multiple bold sections
  md-multiple-bold:
    source_text: 'Features: **fast** processing, **secure** storage, and **reliable** backups.'
    translations:
      ro: ''
      es: ''
    category: marketing

  # Documentation example
  md-documentation:
    source_text: 'To get started, run `npm install` and then execute `npm start`. See [README](./README.md) for **detailed** instructions.'
    translations:
      ro: ''
      es: ''
    category: documentation
    context: 'Quick start guide'

  # Technical content
  md-technical:
    source_text: 'The function returns a `Promise<string>` that resolves with the **translated** text.'
    translations:
      ro: ''
      es: ''
    category: api_docs
    context: 'Function return type description'
